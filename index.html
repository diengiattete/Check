<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ESP Monitor Center - Auth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Tích hợp Chart.js từ CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-dark: #0b0f17;
      --card-bg: rgba(22, 31, 46, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00f2ff;
      --accent-blue: #3b82f6;
      --status-connected: #10b981;
      --status-reconnect: #f59e0b;
      --status-disconnected: #ef4444;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(0, 242, 255, 0.05) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.05) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      padding: 16px;
      min-height: 100vh;
    }

    /* Navbar Header */
    .header {
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 18px 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .header-title-group { display: flex; align-items: center; gap: 12px; }

    .brand-icon {
      width: 12px; height: 12px;
      background: var(--accent-cyan);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent-cyan);
    }

    .header-title {
      font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 0%, #a5f3fc 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .btn-add {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff; font-weight: 600; padding: 12px 20px;
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px;
      cursor: pointer; font-size: 14px; width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s ease; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
    }

    .btn-add:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.5);
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
    }

    /* Grid Layout */
    .esp-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }

    /* Device Card */
    .esp-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 16px; padding: 20px;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      display: flex; flex-direction: column; gap: 16px;
      transition: all 0.3s ease;
    }

    /* Cảnh báo Nguy hiểm (Alarm Glow) */
    .esp-card.card-alarm {
      border-color: #ef4444 !important;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.4) !important;
      animation: alertBlink 1.5s infinite alternate;
    }

    @keyframes alertBlink {
      0% { background: rgba(239, 68, 68, 0.1); }
      100% { background: var(--card-bg); }
    }

    .esp-card-header {
      display: flex; flex-direction: column; gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 14px;
    }

    .device-info { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .device-title { display: flex; align-items: center; gap: 10px; }
    .esp-name { font-size: 16px; font-weight: 700; color: #ffffff; font-family: var(--font-mono); }

    .esp-version {
      font-size: 10px; color: var(--accent-cyan);
      background: rgba(0, 242, 255, 0.08); padding: 3px 8px;
      border-radius: 6px; border: 1px solid rgba(0, 242, 255, 0.25);
      font-family: var(--font-mono); font-weight: 700;
    }

    /* Pulse Status Indicator */
    .status-container {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600; font-family: var(--font-mono);
    }
    .status-led { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-connected .status-led { background-color: var(--status-connected); box-shadow: 0 0 10px var(--status-connected); animation: pulse 2s infinite; }
    .status-connected { color: var(--status-connected); }
    .status-reconnecting .status-led { background-color: var(--status-reconnect); box-shadow: 0 0 10px var(--status-reconnect); animation: pulse 1s infinite; }
    .status-reconnecting { color: var(--status-reconnect); }
    .status-disconnected .status-led { background-color: var(--status-disconnected); box-shadow: 0 0 8px var(--status-disconnected); }
    .status-disconnected { color: var(--status-disconnected); }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    .card-actions { display: flex; gap: 8px; width: 100%; }

    .btn-action {
      flex: 1; border: none; padding: 8px 12px; border-radius: 8px;
      cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s ease;
    }
    .btn-reconnect { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .btn-reconnect:hover { background: rgba(59, 130, 246, 0.3); color: #fff; }
    .btn-disconnect { background: rgba(239, 68, 68, 0.12); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-disconnect:hover { background: rgba(239, 68, 68, 0.25); color: #fff; }

    /* Metrics Grid */
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .metric-box {
      background: rgba(11, 15, 23, 0.6); border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 10px 6px; border-radius: 10px; text-align: center;
    }
    .metric-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
    .metric-val { font-size: 14px; font-weight: 700; color: #ffffff; font-family: var(--font-mono); }

    /* Khung Biểu đồ Chart.js */
    .chart-container {
      position: relative; height: 160px; width: 100%;
      background: rgba(11, 15, 23, 0.5); border-radius: 10px;
      padding: 8px; border: 1px solid rgba(255, 255, 255, 0.04);
    }

    /* Terminal Log & Filters */
    .log-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
    }
    .log-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    .filter-btn-group { display: flex; gap: 4px; }
    .btn-filter {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted); font-size: 9px; padding: 2px 6px; border-radius: 4px; cursor: pointer;
    }
    .btn-filter.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

    .esp-log {
      background: #05070a; color: #10b981; font-family: var(--font-mono);
      padding: 10px; height: 130px; overflow-y: auto; font-size: 11px;
      line-height: 1.5; border-radius: 8px; white-space: pre-wrap; word-break: break-all;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    @media (min-width: 640px) {
      body { padding: 24px; }
      .header { flex-direction: row; justify-content: space-between; align-items: center; }
      .btn-add { width: auto; }
      .esp-grid { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
      .esp-card-header { flex-direction: row; justify-content: space-between; align-items: center; }
      .device-info { width: auto; gap: 16px; }
      .card-actions { width: auto; }
      .btn-action { flex: initial; padding: 7px 14px; }
      .metric-val { font-size: 16px; }
    }
  </style>
</head>
<body>

  <div class="header">

      <div class="brand-icon"></div>
      <h2 class="header-title">ESP Monitor Center</h2>
    </div>

      THÊM THIẾT BỊ
    </button>
  </div>
