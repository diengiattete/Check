<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Giám Sát Nhiệt Độ BLE</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 1200px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1e293b;
      padding: 20px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }

    .header-title h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f3f4f6;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-title h1 i {
      color: #ff7043;
    }

    .header-title p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    button {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    button:hover {
      background-color: #1d4ed8;
      transform: translateY(-2px);
    }

    button.btn-danger {
      background-color: #dc2626;
    }

    button.btn-danger:hover {
      background-color: #b91c1c;
    }

    .dashboard-grid {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }

    .device-card {
      background-color: #1e293b;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #334155;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 15px;
      position: relative;
      overflow: hidden;
    }

    .device-card.alarm {
      border-color: #ef4444;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
      animation: pulse-border 1.5s infinite;
    }

    @keyframes pulse-border {
      0% { border-color: #ef4444; }
      50% { border-color: #7f1d1d; }
      100% { border-color: #ef4444; }
    }

    .device-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }

    .device-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #38bdf8;
    }

    .device-id {
      font-size: 0.75rem;
      color: #64748b;
    }

    .temp-display {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 5px;
      padding: 10px 0;
    }

    .temp-value {
      font-size: 3rem;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: -1px;
    }

    .temp-unit {
      font-size: 1.2rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .chart-container {
      position: relative;
      height: 180px;
      width: 100%;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: #94a3b8;
      padding-top: 10px;
      border-top: 1px solid #334155;
    }

    .status-badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .status-normal {
      background-color: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }

    .status-alarm {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background-color: #1e293b;
      border-radius: 16px;
      border: 1px dashed #334155;
      color: #64748b;
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 15px;
      color: #475569;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <h1><i class="fa-solid fa-temperature-high"></i> Giám Sát Nhiệt Độ BLE</h1>
      <p>Trục Y cố định: 35°C - 70°C | Cảnh báo ngưỡng: 60°C</p>
    </div>
    <div class="controls">
      <button id="btnConnect"><i class="fa-solid fa-plus"></i> Kết Nối Thiết Bị</button>
    </div>
  </header>

  <main class="dashboard-grid" id="dashboard">
    <div class="empty-state" id="emptyState">
      <i class="fa-brands fa-bluetooth-b"></i>
      <h3>Chưa có thiết bị nào được kết nối</h3>
      <p>Nhấn nút "Kết Nối Thiết Bị" để quét và theo dõi thiết bị BLE.</p>
    </div>
  </main>

  <script>
    // Cấu hình tham số hệ thống
    const TEMP_ALARM_THRESHOLD = 60.0; // Ngưỡng cảnh báo: 60°C
    const Y_MIN = 35;                  // Giới hạn dưới trục Y
    const Y_MAX = 70;                  // Giới hạn trên trục Y

    const connectedDevices = new Map();
    const dashboard = document.getElementById('dashboard');
    const emptyState = document.getElementById('emptyState');
    const btnConnect = document.getElementById('btnConnect');

    // Âm thanh cảnh báo bằng Web Audio API
    let audioCtx = null;
    function playAlarmSound() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Tần số 880Hz (Nốt A5)
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    // Xử lý sự kiện kết nối BLE
    btnConnect.addEventListener('click', async () => {
      try {
        if (!navigator.bluetooth) {
          alert('Trình duyệt của bạn không hỗ trợ Web Bluetooth API.');
          return;
        }

        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['environmental_sensing', '0000181a-0000-1000-8000-00805f9b34fb']
        });

        if (connectedDevices.has(device.id)) {
          alert('Thiết bị này đã được kết nối!');
          return;
        }

        createDeviceCard(device);
        
        // Giả lập dữ liệu nhận từ BLE (Đổi đoạn này bằng GATT Notifications thực tế)
        startSimulatedData(device.id);

      } catch (error) {
        console.log('Hủy kết nối hoặc lỗi:', error);
      }
    });

    // Tạo thẻ UI cho thiết bị
    function createDeviceCard(device) {
      emptyState.style.display = 'none';

      const card = document.createElement('div');
      card.className = 'device-card';
      card.id = `card-${device.id}`;
      card.innerHTML = `
        <div class="device-header">
          <div>
            <div class="device-name">${device.name || 'Thiết bị BLE'}</div>
            <div class="device-id">ID: ${device.id}</div>
          </div>
          <span class="status-badge status-normal" id="status-${device.id}">Bình thường</span>
        </div>
        <div class="temp-display">
          <span class="temp-value" id="temp-${device.id}">--.-</span>
          <span class="temp-unit">°C</span>
        </div>
        <div class="chart-container">
          <canvas id="chart-${device.id}"></canvas>
        </div>
        <div class="card-footer">
          <span>Cập nhật lần cuối: <span id="time-${device.id}">--:--:--</span></span>
          <button class="btn-danger" style="padding: 4px 8px; font-size: 0.75rem;" onclick="removeDevice('${device.id}')">Ngắt kết nối</button>
        </div>
      `;

      dashboard.appendChild(card);
      initChart(device.id);
      connectedDevices.set(device.id, { device, chart: null });
    }

    // Khởi tạo biểu đồ với trục Y cố định 35°C - 70°C
    function initChart(deviceId) {
      const ctx = document.getElementById(`chart-${deviceId}`).getContext('2d');
      const chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            label: 'Nhiệt độ (°C)',
            data: [],
            borderColor: '#ff7043',
            backgroundColor: 'rgba(255, 112, 67, 0.15)',
            borderWidth: 2,
            fill: true,
            tension: 0.3,
            pointRadius: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { 
              display: false 
            },
            y: {
              min: Y_MIN, // Cố định giới hạn dưới 35°C
              max: Y_MAX, // Cố định giới hạn trên 70°C
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { color: '#9ca3af', font: { size: 10 } }
            }
          },
          plugins: { 
            legend: { display: false } 
          }
        }
      });

      if (connectedDevices.has(deviceId)) {
        connectedDevices.get(deviceId).chart = chart;
      }
    }

    // Cập nhật giá trị nhiệt độ và đồ thị
    function updateTemperature(deviceId, temp) {
      const card = document.getElementById(`card-${deviceId}`);
      const tempEl = document.getElementById(`temp-${deviceId}`);
      const statusEl = document.getElementById(`status-${deviceId}`);
      const timeEl = document.getElementById(`time-${deviceId}`);

      if (!card) return;

      tempEl.textContent = temp.toFixed(1);
      timeEl.textContent = new Date().toLocaleTimeString();

      // Kiểm tra ngưỡng cảnh báo 60°C
      if (temp >= TEMP_ALARM_THRESHOLD) {
        card.classList.add('alarm');
        statusEl.className = 'status-badge status-alarm';
        statusEl.textContent = 'CẢNH BÁO QUÁ NHIỆT';
        playAlarmSound();
      } else {
        card.classList.remove('alarm');
        statusEl.className = 'status-badge status-normal';
        statusEl.textContent = 'Bình thường';
      }

      // Cập nhật Chart.js
      const dev = connectedDevices.get(deviceId);
      if (dev && dev.chart) {
        const chart = dev.chart;
        const timeLabel = new Date().toLocaleTimeString();

        chart.data.labels.push(timeLabel);
        chart.data.datasets[0].data.push(temp);

        // Giữ tối đa 20 điểm dữ liệu trên đồ thị
        if (chart.data.labels.length > 20) {
          chart.data.labels.shift();
          chart.data.datasets[0].data.shift();
        }

        chart.update();
      }
    }

    // Giả lập luồng nhận dữ liệu liên tục để test UI
    function startSimulatedData(deviceId) {
      let currentTemp = 45.0;
      const interval = setInterval(() => {
        if (!connectedDevices.has(deviceId)) {
          clearInterval(interval);
          return;
        }

        // Biến động ngẫu nhiên nhiệt độ từ 36°C đến 68°C
        const delta = (Math.random() - 0.48) * 3;
        currentTemp = Math.min(Math.max(currentTemp + delta, 36.0), 68.0);
        
        updateTemperature(deviceId, currentTemp);
      }, 2000);
    }

    // Ngắt kết nối & xóa thẻ
    function removeDevice(deviceId) {
      if (connectedDevices.has(deviceId)) {
        connectedDevices.delete(deviceId);
      }
      const card = document.getElementById(`card-${deviceId}`);
      if (card) card.remove();

      if (connectedDevices.size === 0) {
        emptyState.style.display = 'block';
      }
    }
  </script>
</body>
</html>
